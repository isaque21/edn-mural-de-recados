<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural de Recados - Escola da Nuvem</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mural de Recados</h1>
    <p>Lab Escola da Nuvem: S3 + CloudFront + API Gateway + DynamoDB</p>
  </header>

  <main>
    <section class="card">
      <h2>Deixe seu recado</h2>
      <form id="form-recado" novalidate>
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" maxlength="50" placeholder="Seu nome" required>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="4" maxlength="280" placeholder="Escreva algo para a turma" required></textarea>

        <button type="submit" id="btn-enviar">Enviar</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="card">
      <div class="titulo-lista">
        <h2>Recados</h2>
        <button type="button" id="btn-atualizar" class="secundario">Atualizar</button>
      </div>
      <ul id="lista-recados"></ul>
    </section>
  </main>

  <footer>
    <p>Servido via Amazon CloudFront a partir de um bucket S3 privado.</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
